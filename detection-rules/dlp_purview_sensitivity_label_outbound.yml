name: "DLP: Purview Sensitivity Label - High Sensitivity Content"
description: |
  Detects outbound emails carrying a Microsoft Purview (MSIP) sensitivity label
  indicating high-sensitivity content such as Confidential, Restricted, or Secret.
  May indicate intentional or accidental exfiltration of classified content.
type: rule
severity: "low"
source: |
  type.outbound
  and any(headers.hops,
          any(.fields,
              .name =~ "msip_labels"
              and strings.icontains(.value,
                                    "Confidential",
                                    "Restricted",
                                    "Secret"
              )
          )
  )
attack_types:
  - "DLP: Personal Data"
tags:
  - "DLP"
  - "Confidential"
  - "MSIP"
  - "Data exfiltration"
  - pr_author_Jummyberry
id: "1662e84c-f431-51d5-bb4b-695d082debe9"
